<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 200" width="960" height="200" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <rect width="960" height="200" fill="#ffffff"/>
  <!-- Stap 1: BEGRIJPEN -->
  <polygon points="40,100 235,30 430,100 235,170" fill="#f4f4f5" stroke="#3f3f46" stroke-width="2"/>
  <line x1="235" y1="30" x2="235" y2="170" stroke="#c9c9cf" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="235" y="14" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">BEGRIJPEN</text>
  <text x="137" y="104" text-anchor="middle" font-size="11" fill="#71717a">breed kijken</text>
  <text x="137" y="119" text-anchor="middle" font-size="10" fill="#a1a1aa">naar onderwerpen</text>
  <text x="333" y="104" text-anchor="middle" font-size="11" fill="#71717a">samenvatten</text>
  <text x="333" y="119" text-anchor="middle" font-size="10" fill="#a1a1aa">tot een overzicht</text>
  <text x="235" y="192" text-anchor="middle" font-size="10" fill="#a1a1aa">zonder zoekvraag</text>
  <!-- Stap 2: KIEZEN -->
  <polygon points="530,100 725,30 920,100 725,170" fill="#e9eefe" stroke="#4376fc" stroke-width="2"/>
  <line x1="725" y1="30" x2="725" y2="170" stroke="#b4c4fc" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="725" y="14" text-anchor="middle" font-size="15" font-weight="700" fill="#2f54d4">KIEZEN</text>
  <text x="627" y="104" text-anchor="middle" font-size="11" fill="#2f54d4">breed kijken</text>
  <text x="627" y="119" text-anchor="middle" font-size="10" fill="#6b7fc7">alle kandidaten</text>
  <text x="823" y="104" text-anchor="middle" font-size="11" fill="#2f54d4">samenvatten</text>
  <text x="823" y="119" text-anchor="middle" font-size="10" fill="#6b7fc7">naar de top ~100</text>
  <text x="725" y="192" text-anchor="middle" font-size="10" fill="#6b7fc7">met de zoekvraag</text>
