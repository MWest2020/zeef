<script>
(function () {
  "use strict";
  var data = JSON.parse(document.getElementById("zeef-data").textContent);

  function el(tag, text, cls) {
    var e = document.createElement(tag);
    if (text != null) e.textContent = text;  // DOM-tekstweg: onvertrouwde tekst escapet hier
    if (cls) e.className = cls;
    return e;
  }
  function field(label, value) {
    var d = el("div", null, "field");
    d.appendChild(el("span", label + ": ", "fieldlabel"));
    d.appendChild(el("span", value, "fieldval"));
    return d;
  }
  function byId(id) { return document.getElementById(id); }

  byId("query").textContent = data.query || "—";
  var c = data.counts || {};
  byId("counts").textContent =
    (c.selected || 0) + " geselecteerd · " + (c.out_of_scope || 0) + " uitgesloten (wv. " +
    (c.validity_excluded || 0) + " validity) · " + (c.total || 0) + " totaal";
  byId("generated").textContent = data.generated_at || "";

  function renderDoc(doc, id) {
    if (!doc) return el("div", id + " (detail ontbreekt)", "missing");
    var wrap = el("details", null, "doc");
    var sm = el("summary");
    sm.appendChild(el("span", doc.name || doc.id, "docname"));
    sm.appendChild(el("span", String(Math.round((doc.score || 0) * 100)), "docscore"));
    if (doc.redaction) sm.appendChild(el("span", "gelakt", "badge redaction"));
    wrap.appendChild(sm);
    var body = el("div", null, "docbody");
    if (doc.summary) body.appendChild(field("Samenvatting", doc.summary));
    if (doc.rationale) body.appendChild(field("Motivatie", doc.rationale));
    if (doc.reason) body.appendChild(field("Reden", doc.reason));
    if (doc.redaction) body.appendChild(field("Status", doc.redaction));
    var rels = doc.relations || [];
    if (rels.length) {
      var box = el("div", null, "relations");
      box.appendChild(el("div", "Relaties", "fieldlabel"));
      rels.forEach(function (r) {
        var line = el("div", null, "relation");
        line.appendChild(el("span", r.kind, "relkind"));
        var tgt = (data.documents || {})[r.target];
        line.appendChild(el("span", " → " + (tgt ? (tgt.name || r.target) : r.target)));
        if (r.evidence) line.appendChild(el("span", " (" + r.evidence + ")"));
        box.appendChild(line);
      });
      body.appendChild(box);
    }
    wrap.appendChild(body);
    return wrap;
  }

  var core = byId("core");
  var topics = (data.topics && data.topics.onderwerpen) || [];
  topics.forEach(function (ond) {
    var d = el("details", null, "onderwerp");
    var s = el("summary");
    s.appendChild(el("span", ond.label, "label"));
    var subs = ond.deelonderwerpen || [];
    var n = subs.reduce(function (a, sub) { return a + (sub.doc_ids || []).length; }, 0);
    s.appendChild(el("span", " (" + n + ")", "count"));
    d.appendChild(s);
    subs.forEach(function (sub) {
      var dd = el("details", null, "deel");
      var ss = el("summary");
      ss.appendChild(el("span", sub.label, "label"));
      ss.appendChild(el("span", " (" + (sub.doc_ids || []).length + ")", "count"));
      dd.appendChild(ss);
      (sub.doc_ids || []).forEach(function (id) {
        dd.appendChild(renderDoc((data.documents || {})[id], id));
      });
      d.appendChild(dd);
    });
    core.appendChild(d);
  });

  var ex = byId("excluded");
  var groups = [["validity", "Validity-uitsluitingen (mechanisch onbruikbaar)"],
                ["semantic", "Semantisch buiten scope"]];
  groups.forEach(function (g) {
    var items = (data.excluded || []).filter(function (e) { return e.kind === g[0]; });
    if (!items.length) return;
    var d = el("details", null, "exgroup");
    var s = el("summary");
    s.appendChild(el("span", g[1], "label"));
    s.appendChild(el("span", " (" + items.length + ")", "count"));
    d.appendChild(s);
    var byReason = {};
    items.forEach(function (e) { (byReason[e.reason] = byReason[e.reason] || []).push(e); });
    Object.keys(byReason).sort().forEach(function (reason) {
      var rd = el("details", null, "exreason");
      var rs = el("summary");
      rs.appendChild(el("span", reason, "label"));
      rs.appendChild(el("span", " (" + byReason[reason].length + ")", "count"));
      rd.appendChild(rs);
      byReason[reason].forEach(function (e) {
        var line = el("div", null, "exdoc");
        line.appendChild(el("span", e.name || e.id, "docname"));
        if (e.redaction) line.appendChild(el("span", "gelakt", "badge redaction"));
        rd.appendChild(line);
      });
      d.appendChild(rd);
    });
    ex.appendChild(d);
  });
})();
